  <circle cx="1098" cy="64" r="17" fill="#0d1020" stroke="url(#grad)" stroke-width="2.5"/>
  <text x="1098" y="70.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="url(#grad)">N</text>
  <circle cx="1111" cy="51" r="5.2" fill="#0d1020" stroke="#34d399" stroke-width="1.6"/>
  <circle cx="1111" cy="51" r="2.3" fill="#34d399"/>

  <!-- node chip + glyph -->
  <rect x="40" y="30" width="68" height="68" rx="16" fill="url(#grad)"/>
