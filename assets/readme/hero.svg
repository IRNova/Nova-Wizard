<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Nova Wizard, a local OAuth deployer for Nova Proxy on Cloudflare Workers</title>
  <desc id="heroDesc">A near-black panel. On the left, the Nova Wizard wordmark in a cyan to violet gradient, the line "Local OAuth deployer for Nova Proxy on Cloudflare Workers", and three proof chips: one click, local OAuth with no tokens, Windows and Linux. On the right, a deploy flow: your own machine authorizes with Cloudflare using OAuth, and a live Worker node lights up with bound KV and D1 resources.</desc>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gradH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="410" rx="26" fill="#05060a"/>
  <rect x="1" y="1" width="1198" height="408" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  <circle cx="1010" cy="70" r="300" fill="url(#glowCyan)"/>
  <circle cx="820" cy="420" r="300" fill="url(#glowViolet)"/>

  <!-- ===== LEFT: title block ===== -->
  <g transform="translate(72 66)">
    <!-- logo lockup -->
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#grad)"/>
    <text x="23" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#05060a">N</text>
    <text x="62" y="21" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" letter-spacing="5" fill="#22d3ee">LOCAL OAUTH DEPLOYER</text>
    <text x="62" y="41" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" letter-spacing="1" fill="#6b7688">for Nova Proxy on Cloudflare Workers</text>

    <!-- wordmark -->
    <text x="0" y="140" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="78" font-weight="800" letter-spacing="-1" fill="url(#gradH)">Nova Wizard</text>

    <!-- value line -->
    <text x="2" y="188" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="500" fill="#c5cbd8">Deploy Nova Proxy to your own Cloudflare account.</text>
    <text x="2" y="220" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="500" fill="#c5cbd8">One click, local OAuth, no dashboard, no CLI.</text>

    <!-- proof chips -->
    <g transform="translate(2 258)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="600">
      <g>
        <rect x="0" y="0" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
        <circle cx="24" cy="20" r="5" fill="#22d3ee"/>
        <text x="38" y="26" fill="#e6e9f0">One click</text>
      </g>
      <g transform="translate(162 0)">
        <rect x="0" y="0" width="214" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
        <circle cx="24" cy="20" r="5" fill="#818cf8"/>
        <text x="38" y="26" fill="#e6e9f0">Local OAuth, no tokens</text>
      </g>
      <g transform="translate(388 0)">
        <rect x="0" y="0" width="184" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
        <circle cx="24" cy="20" r="5" fill="#a855f7"/>
        <text x="38" y="26" fill="#e6e9f0">Windows + Linux</text>
      </g>
    </g>
  </g>

  <!-- ===== RIGHT: deploy flow ===== -->
  <g transform="translate(724 0)">
    <!-- panel frame -->
    <rect x="0" y="52" width="404" height="306" rx="20" fill="#0a0c14" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="3" fill="#6b7688">DEPLOY FLOW</text>

    <!-- connector: machine -> worker -->
    <path d="M96 168 C 160 168 176 205 232 205" fill="none" stroke="url(#gradH)" stroke-width="2.5"/>
    <circle cx="164" cy="185" r="4.5" fill="#818cf8"/>
    <!-- key on the path -->
    <g transform="translate(150 150)">
      <rect x="0" y="0" width="30" height="16" rx="8" fill="#0a0c14" stroke="#22d3ee" stroke-width="1.5"/>
      <circle cx="8" cy="8" r="3.4" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
      <path d="M12 8 H24 M20 8 V13 M24 8 V13" stroke="#22d3ee" stroke-width="1.5" fill="none"/>
      <text x="15" y="-6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#9aa4b8">authorize</text>
    </g>

    <!-- Node 1: your machine -->
    <g transform="translate(24 128)">
      <rect x="0" y="0" width="72" height="52" rx="9" fill="#11141d" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="8" y="8" width="56" height="30" rx="4" fill="#0a0c14" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="14" cy="14" r="2" fill="#f87171"/>
      <circle cx="21" cy="14" r="2" fill="#f59e0b"/>
      <circle cx="28" cy="14" r="2" fill="#34d399"/>
      <path d="M28 44 H44" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
      <text x="36" y="72" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#c5cbd8">Your machine</text>
    </g>

    <!-- Node 2: Cloudflare Worker (lit) -->
    <g transform="translate(232 130)">
      <circle cx="75" cy="75" r="86" fill="url(#nodeGlow)"/>
      <rect x="27" y="27" width="96" height="96" rx="22" fill="#0d1020" stroke="url(#grad)" stroke-width="2.5"/>
      <rect x="27" y="27" width="96" height="96" rx="22" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="8"/>
      <text x="75" y="88" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="46" font-weight="800" fill="url(#grad)">N</text>
      <!-- live dot -->
      <circle cx="112" cy="40" r="8" fill="#0d1020" stroke="#34d399" stroke-width="2"/>
      <circle cx="112" cy="40" r="3.5" fill="#34d399"/>
      <text x="75" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6e9f0">Worker live</text>
    </g>

    <!-- bound resources KV + D1 -->
    <g transform="translate(232 300)">
      <path d="M75 0 V-14" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
      <path d="M42 8 H108 M42 8 V0 M108 8 V0" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none"/>
      <g transform="translate(20 8)">
        <rect x="0" y="0" width="44" height="30" rx="8" fill="#11141d" stroke="#22d3ee" stroke-opacity="0.4"/>
        <text x="22" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#22d3ee">KV</text>
      </g>
      <g transform="translate(86 8)">
        <rect x="0" y="0" width="44" height="30" rx="8" fill="#11141d" stroke="#a855f7" stroke-opacity="0.4"/>
        <text x="22" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#c89bf5">D1</text>
      </g>
    </g>
  </g>
</svg>
