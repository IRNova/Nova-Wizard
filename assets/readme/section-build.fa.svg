<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="128" viewBox="0 0 1200 128" role="img" aria-labelledby="t d" direction="rtl">
  <title id="t">ساخت از سورس</title>
  <desc id="d">بنر بخش: ساخت از سورس. ورکر را کلون کن، ⁦PyInstaller⁩ نصب کن، ⁦EXE⁩ بساز.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gradH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#818cf8"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="128" rx="20" fill="#0a0c14"/>
  <rect x="1" y="1" width="1198" height="126" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- recurring deploy motif on the left (RTL): authorize track into a live Worker node -->
  <circle cx="102" cy="64" r="66" fill="url(#pulse)"/>
  <path d="M420 64 H252" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" stroke-dasharray="2 11"/>
  <path d="M244 64 H142" fill="none" stroke="url(#gradH)" stroke-width="2.5"/>
  <circle cx="102" cy="64" r="17" fill="#0d1020" stroke="url(#grad)" stroke-width="2.5"/>
  <text x="102" y="70.5" text-anchor="middle" direction="ltr" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="url(#grad)">N</text>
  <circle cx="89" cy="51" r="5.2" fill="#0d1020" stroke="#34d399" stroke-width="1.6"/>
  <circle cx="89" cy="51" r="2.3" fill="#34d399"/>

  <!-- node chip + glyph (right side) -->
  <rect x="1092" y="30" width="68" height="68" rx="16" fill="url(#grad)"/>
  <g transform="translate(1092 30)">
      <path d="M26 21 L13 34 L26 47 M42 21 L55 34 L42 47" fill="none" stroke="#05060a" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title + descriptor (right-aligned RTL) -->
  <text x="1076" y="58" text-anchor="start" font-family="Vazirmatn,Tahoma,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#f0f2f7">ساخت از سورس</text>
  <circle cx="1082" cy="88" r="4" fill="#818cf8"/>
  <text x="1068" y="94" text-anchor="start" font-family="Vazirmatn,Tahoma,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#9aa4b8">ورکر را کلون کن، ⁦PyInstaller⁩ نصب کن، ⁦EXE⁩ بساز</text>
</svg>
